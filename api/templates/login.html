{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>🔒 Login</h1>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autofocus required>
    <p><button class="btn primary" type="submit">Enter</button></p>
  </form>
</div>
{% endblock %}
